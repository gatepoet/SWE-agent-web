tools:
  github_issues_list:
    signature: "github_issues list --owner <owner> --repo <repo> [--state <state>] [--max-results <max_results>]"
    docstring: "List GitHub issues for a repository. Returns an array of issue objects with number, title, state, html_url, body, created_at, and updated_at."
    arguments:
      - name: owner
        type: string
        description: "Repository owner/organization"
        required: true
      - name: repo
        type: string
        description: "Repository name"
        required: true
      - name: state
        type: string
        description: "Filter issues by state (open, closed, or all)"
        required: false
        enum: ["open", "closed", "all"]
      - name: max_results
        type: integer
        description: "Maximum number of results to return"
        required: false
  github_issues_get:
    signature: "github_issues get --owner <owner> --repo <repo> --issue-number <issue_number>"
    docstring: "Get details for a specific GitHub issue. Returns an object with number, title, state, html_url, body, created_at, updated_at, labels, and assignees."
    arguments:
      - name: owner
        type: string
        description: "Repository owner/organization"
        required: true
      - name: repo
        type: string
        description: "Repository name"
        required: true
      - name: issue_number
        type: integer
        description: "Issue number to retrieve"
        required: true
  github_issues_create:
    signature: "github_issues create --owner <owner> --repo <repo> --title <title> [--body <body>] [--labels <labels>]"
    docstring: "Create a new GitHub issue. Returns an object with number, title, html_url, and state."
    arguments:
      - name: owner
        type: string
        description: "Repository owner/organization"
        required: true
      - name: repo
        type: string
        description: "Repository name"
        required: true
      - name: title
        type: string
        description: "Issue title"
        required: true
      - name: body
        type: string
        description: "Issue description/content"
        required: false
      - name: labels
        type: array
        items:
          type: string
        description: "Array of label names to apply to the issue"
        required: false
  github_issues_modify:
    signature: "github_issues modify --owner <owner> --repo <repo> --issue-number <issue_number> [--title <title>] [--body <body>] [--state <state>] [--labels <labels>]"
    docstring: "Modify an existing GitHub issue. Returns success status."
    arguments:
      - name: owner
        type: string
        description: "Repository owner/organization"
        required: true
      - name: repo
        type: string
        description: "Repository name"
        required: true
      - name: issue_number
        type: integer
        description: "Issue number to modify"
        required: true
      - name: title
        type: string
        description: "New title for the issue (optional)"
        required: false
      - name: body
        type: string
        description: "New content/description for the issue (optional)"
        required: false
      - name: state
        type: string
        description: "New state for the issue (open or closed)"
        required: false
        enum: ["open", "closed"]
      - name: labels
        type: array
        items:
          type: string
        description: "Array of label names to apply to the issue"
        required: false
  github_issues_comment:
    signature: "github_issues comment --owner <owner> --repo <repo> --issue-number <issue_number> --body <body>"
    docstring: "Add a comment to a GitHub issue. Returns success status."
    arguments:
      - name: owner
        type: string
        description: "Repository owner/organization"
        required: true
      - name: repo
        type: string
        description: "Repository name"
        required: true
      - name: issue_number
        type: integer
        description: "Issue number to add comment to"
        required: true
      - name: body
        type: string
        description: "Comment text/content"
        required: true
state_command: "_state_github_issues"